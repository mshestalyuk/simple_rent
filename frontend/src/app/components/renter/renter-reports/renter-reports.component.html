<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleRent - My Reports</title>
</head>
<body>
    <!-- Animated background -->
    <div class="page-background"></div>
    
    <!-- Floating elements -->
    <div class="floating-elements">
        <div class="float-element"></div>
        <div class="float-element"></div>
        <div class="float-element"></div>
    </div>

    <!-- Main container -->
    <div class="tenant-reports-container">
        <!-- Page header -->
        <div class="page-header">
            <h1 class="page-title">
                <span class="title-accent">Your Reports</span>
            </h1>
            <p class="page-subtitle">Manage your reports and track their status</p>
        </div>

        <!-- Stats cards -->
        <div class="stats-row">
            <div class="stat-card in-progress">
                <div class="stat-number">1</div>
                <div class="stat-label">In progress</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-number">1</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card total">
                <div class="stat-number">2</div>
                <div class="stat-label">All reports</div>
            </div>
        </div>

        <!-- Report list -->
        <div class="report-list">
            <!-- In-progress report -->
            <div class="report-item" data-status="in-progress">
                <div class="report-icon">
                    <span class="icon-clock"></span>
                </div>
                <div class="report-content">
                    <h2 class="report-title">Report #1</h2>
                    <p class="report-description">Washing machine malfunction in bathroom</p>
                    <div class="report-meta">
                        <div class="meta-item">
                            <span class="status-badge in-progress">In progress</span>
                        </div>
                        <div class="meta-item">
                            <span class="icon-calendar"></span>
                            <span>Report date: 01.01.2024</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Completed report -->
            <div class="report-item" data-status="completed">
                <div class="report-icon">
                    <span class="icon-check"></span>
                </div>
                <div class="report-content">
                    <h2 class="report-title">Report #2</h2>
                    <p class="report-description">Light bulb replacement in kitchen</p>
                    <div class="report-meta">
                        <div class="meta-item">
                            <span class="status-badge completed">Completed</span>
                        </div>
                        <div class="meta-item">
                            <span class="icon-calendar"></span>
                            <span>Report date: 05.01.2024</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add new report form -->
        <div class="add-report-section">
            <h2 class="section-header">Add new report</h2>
            <form class="report-form" id="newReportForm">
                <div class="form-group">
                    <label class="form-label" for="reportName">Report name</label>
                    <input type="text" id="reportName" class="form-input" placeholder="e.g. Heating malfunction" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="reportDetails">Report details</label>
                    <textarea id="reportDetails" class="form-textarea" placeholder="Describe the problem in detail..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="urgency">Report urgency</label>
                    <select id="urgency" class="form-select urgency-select" required>
                        <option value="yellow">
                            <span class="urgency-indicator" style="background-color: #f093fb;"></span>
                            Important, but can wait
                        </option>
                        <option value="red">
                            <span class="urgency-indicator" style="background-color: #f5576c;"></span>
                            Should be resolved now
                        </option>
                        <option value="green">
                            <span class="urgency-indicator" style="background-color: #4ade80;"></span>
                            Can wait
                        </option>
                    </select>
                </div>
                
                <button type="submit" class="submit-button">Submit report</button>
            </form>
        </div>
    </div>

    <script>
        // Form submission handler
        document.getElementById('newReportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Here you would typically send the form data to your backend
            const formData = {
                name: document.getElementById('reportName').value,
                details: document.getElementById('reportDetails').value,
                urgency: document.getElementById('urgency').value
            };
            
            console.log('Form submitted:', formData);
            alert('Report has been submitted!');
            
            // Clear form
            this.reset();
        });
    </script>
</body>
</html>
