<div class="account">
    <h1>Your Account</h1>
  
    <div class="account-info">
      <p><strong>First Name:</strong> Jan</p>
      <p><strong>Last Name:</strong> Kowalski</p>
      <p><strong>Email:</strong> jan.kowalski@example.com</p>
      <p><strong>Phone Number:</strong> 123-456-789</p>
    </div>
  
    <!-- Account data edit form -->
    <div class="edit-account">
      <h2>Edit account details</h2>
      <form>
        <div class="form-group">
          <label for="firstName">First Name:</label>
          <input type="text" id="firstName" name="firstName" placeholder="First Name">
        </div>
  
        <div class="form-group">
          <label for="lastName">Last Name:</label>
          <input type="text" id="lastName" name="lastName" placeholder="Last Name">
        </div>
  
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Email" disabled>
        </div>
  
        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" placeholder="Phone Number">
        </div>
  
        <div class="form-group">
          <label for="password">New Password:</label>
          <input type="password" id="password" name="password" placeholder="New Password">
        </div>
  
        <button type="submit">Save changes</button>
      </form>
    </div>
  </div>
