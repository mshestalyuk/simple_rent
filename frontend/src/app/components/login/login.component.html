<!-- login.component.html -->

<div class="login">
  <!-- Animated Background -->
  <div class="animated-background"></div>
  
  <!-- Floating shapes for visual interest -->
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  
  <!-- Header -->
  <div class="header">
    <nav class="navbar">
      <div class="logo" (click)="returnHome()">
        <span class="logo-text">Simple<span class="logo-accent">Rent</span></span>
      </div>
      <div class="nav-links">
        <a class="nav-link" (click)="redirectSection('tutorial')">Get Started</a>
        <a class="nav-link" (click)="redirectSection('info')">About</a>
        <a class="nav-link cta-button" (click)="redirectToRegister()">Sign Up</a>
      </div>
      <div class="mobile-menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>
  </div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <!-- Decorative gradient orb -->
      <div class="gradient-orb"></div>
      
      <form [formGroup]="loginForm" (ngSubmit)="loginUser()" class="login-form">
        <div class="form-header">
          <h2>Welcome Back</h2>
          <p>Sign in to your account to continue</p>
        </div>
    
        <div class="form-group">
          <label for="username">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3 5C3 3.89543 3.89543 3 5 3H15C16.1046 3 17 3.89543 17 5V15C17 16.1046 16.1046 17 15 17H5C3.89543 17 3 16.1046 3 15V5Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 7L10 11L17 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Email Address
          </label>
          <input 
            type="email" 
            id="username" 
            formControlName="username" 
            name="username" 
            placeholder="you@example.com"
            required
            [class.error]="username.invalid && (username.dirty || username.touched)"
          >
          <div class="error-messages" *ngIf="username.invalid && (username.dirty || username.touched)">
            <small *ngIf="username.errors?.['required']">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor"/>
                <path d="M8 5V9M8 11H8.01" stroke="currentColor" stroke-linecap="round"/>
              </svg>
              Email is required
            </small>
            <small *ngIf="username.errors?.['email']">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor"/>
                <path d="M8 5V9M8 11H8.01" stroke="currentColor" stroke-linecap="round"/>
              </svg>
              Please enter a valid email
            </small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="5" y="9" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 9V6C7 4.34315 8.34315 3 10 3C11.6569 3 13 4.34315 13 6V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="10" cy="13" r="1" fill="currentColor"/>
            </svg>
            Password
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              formControlName="password" 
              name="password" 
              placeholder="Enter your password"
              required
              [class.error]="password.invalid && (password.dirty || password.touched)"
            >
            <button type="button" class="toggle-password">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 12C11.1046 12 12 11.1046 12 10C12 8.89543 11.1046 8 10 8C8.89543 8 8 8.89543 8 10C8 11.1046 8.89543 12 10 12Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="M18 10C18 10 15 4 10 4C5 4 2 10 2 10C2 10 5 16 10 16C15 16 18 10 18 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="error-messages" *ngIf="password.invalid && (password.dirty || password.touched)">
            <small *ngIf="password.errors?.['required']">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor"/>
                <path d="M8 5V9M8 11H8.01" stroke="currentColor" stroke-linecap="round"/>
              </svg>
              Password is required
            </small>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="submit-button">
            Sign In
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
    
        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social-login">
          <button type="button" class="social-button">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M18.1713 8.36792H17.5V8.33337H10V11.6667H14.7096C14.0225 13.607 12.1762 15 10 15C7.23875 15 5 12.7613 5 10C5 7.23875 7.23875 5 10 5C11.2746 5 12.4342 5.48087 13.3171 6.26625L15.6742 3.90917C14.1858 2.52254 12.195 1.66671 10 1.66671C5.39792 1.66671 1.66666 5.39796 1.66666 10C1.66666 14.6021 5.39792 18.3334 10 18.3334C14.6021 18.3334 18.3333 14.6021 18.3333 10C18.3333 9.44129 18.2758 8.89587 18.1713 8.36792Z" fill="#FFC107"/>
              <path d="M2.6275 6.12129L5.36542 8.12921C6.10625 6.29504 7.90042 5.00004 10 5.00004C11.2746 5.00004 12.4342 5.48087 13.3171 6.26629L15.6742 3.90921C14.1858 2.52254 12.195 1.66671 10 1.66671C6.79917 1.66671 4.02334 3.47379 2.6275 6.12129Z" fill="#FF3D00"/>
              <path d="M10 18.3334C12.1525 18.3334 14.1084 17.5096 15.5871 16.17L13.0079 13.9875C12.1431 14.6452 11.0864 15.0009 10 15C7.8325 15 5.99209 13.618 5.29876 11.6892L2.58126 13.7829C3.96042 16.4817 6.76126 18.3334 10 18.3334Z" fill="#4CAF50"/>
              <path d="M18.1713 8.36796H17.5V8.33337H10V11.6667H14.7096C14.3809 12.5902 13.7889 13.3972 13.0067 13.988L13.0079 13.9871L15.5871 16.1696C15.4046 16.3355 18.3333 14.1667 18.3333 10C18.3333 9.44129 18.2758 8.89587 18.1713 8.36796Z" fill="#1976D2"/>
            </svg>
            Google
          </button>
        </div>

        <div class="signup-prompt">
          Don't have an account? 
          <a (click)="redirectToRegister()">Sign up for free</a>
        </div>
      </form>
    </div>
  </div>
</div>
